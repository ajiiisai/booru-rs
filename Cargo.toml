[package]
name = "booru-rs"
version = "1.1.0"
edition = "2024"
rust-version = "1.92"
description = "An async Booru client for Rust"
license = "MIT"
documentation = "https://docs.rs/booru-rs"
repository = "https://github.com/ajiiisai/booru-rs"
readme = "README.md"

[features]
default = ["danbooru", "gelbooru", "safebooru", "rule34"]
danbooru = []
gelbooru = []
safebooru = []
rule34 = []
live-tests = []
download = [
    "dep:tempfile",
    "dep:md5",
    "reqwest/stream",
    "tokio/fs",
    "tokio/io-util",
    "tokio/rt",
]

[[example]]
name = "basic"
required-features = ["danbooru", "safebooru"]

[[example]]
name = "download"
required-features = ["download", "safebooru"]

[[example]]
name = "error_handling"
required-features = ["danbooru", "safebooru"]

[[example]]
name = "gelbooru"
required-features = ["gelbooru"]

[[example]]
name = "pagination"
required-features = ["safebooru"]

[[test]]
name = "danbooru_client_tests"
required-features = ["danbooru"]

[[test]]
name = "danbooru_tests"
required-features = ["danbooru"]

[[test]]
name = "gelbooru_client_tests"
required-features = ["gelbooru"]

[[test]]
name = "gelbooru_tests"
required-features = ["gelbooru"]

[[test]]
name = "rule34_client_tests"
required-features = ["rule34"]

[[test]]
name = "rule34_tests"
required-features = ["rule34"]

[[test]]
name = "safebooru_client_tests"
required-features = ["safebooru"]

[[test]]
name = "safebooru_tests"
required-features = ["safebooru"]

[[test]]
name = "mock_tests"
required-features = ["danbooru", "gelbooru", "rule34", "safebooru"]

[[test]]
name = "live_contract_tests"
required-features = ["live-tests", "danbooru", "gelbooru", "rule34", "safebooru"]

[profile.dev]
opt-level = 1

[profile.release]
opt-level = 3

[dependencies]
reqwest = { version = "0.12.4", features = ["json", "rustls-tls"], default-features = false }
tokio = { version = "1.48", features = ["sync", "time"] }
serde = { version = "1.0.185", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
futures-core = "0.3.31"
tempfile = { version = "3", optional = true }
md5 = { version = "0.8.1", optional = true }

[dev-dependencies]
tokio = { version = "1.48", features = ["rt-multi-thread", "macros", "time"] }
wiremock = "0.6"
