name: Release automation

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-plz-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  detect-release:
    name: Identify release commit
    if: github.repository == 'ajiiisai/booru-rs' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      release: ${{ steps.detect.outputs.release }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - id: detect
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          release=$(gh api "repos/$GH_REPO/commits/$GITHUB_SHA/pulls" \
            --jq 'any(.[]; .merged_at != null and .base.ref == "main" and (.head.ref | startswith("release-plz-")))')

          version=$(sed -n '/^version = /{s/.*"\([^"]*\)".*/\1/p;q;}' Cargo.toml)
          if gh api "repos/$GH_REPO/git/ref/tags/v$version" >/dev/null 2>&1; then
            tag_exists=true
          else
            tag_exists=false
          fi

          # A merged release PR can fail before publishing. Retry the release
          # while the version in Cargo.toml still has no matching tag.
          if [[ "$tag_exists" == "false" ]]; then
            release=true
          fi

          echo "release=$release" >> "$GITHUB_OUTPUT"

  release:
    name: Validate and publish
    needs: [detect-release]
    if: needs.detect-release.outputs.release == 'true'
    runs-on: ubuntu-latest
    environment: crates-io
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Run clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Run tests
        run: cargo test --workspace
      - name: Check documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --no-deps
      - name: Dry-run publish
        run: cargo publish --dry-run --locked
      - name: Publish merged release PR
        uses: release-plz/action@v0.5
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  release-pr:
    name: Update release PR
    needs: [detect-release, release]
    if: >-
      always() && !cancelled() &&
      needs.detect-release.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Update versions and changelog
        uses: release-plz/action@v0.5
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
